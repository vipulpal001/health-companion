server.port=8080

# Application Name
spring.application.name=health-companion-backend

# File Upload configurations (for lab reports and medical documents)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Default to In-Memory H2 for seamless instant execution, easily switched to PostgreSQL via application-postgres.properties or SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:healthcompanion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.name=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
